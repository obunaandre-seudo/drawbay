services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drawbay
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: drawbay
    volumes:
      - drawbay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawbay -d drawbay"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://drawbay:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/drawbay
      DATABASE_SSL: "false"
      TRUST_PROXY: "true"
      NODE_ENV: production
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  drawbay-postgres:
